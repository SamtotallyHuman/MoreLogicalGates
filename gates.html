<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Logic Circuit Editor</title>
        <style>
            :root {
                --bg: #172532;
                --panel: #263d50;
                --panel2: #314e66;
                --line: #7890a3;
                --text: #e7eef5;
                --accent: #00b9df;
                --gate: #353229;
                --gateStroke: #171717;
                --wire: #202830;
                --grid: #dfe5ea;
                --gridMajor: #c7d0d8;
                --danger: #b84a4a;
                --ioLabel: #34576d;
                --ioLabelBg: #161819;
                --ioValueBg: #dbeaf0;
                --ioValueStroke: #171717;
                --ioValueText: #173544;
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                font-family:
                    Inter,
                    system-ui,
                    -apple-system,
                    Segoe UI,
                    Arial,
                    sans-serif;
            }
            body {
                background: var(--bg);
                color: var(--text);
            }
            #app {
                width: 100%;
                height: 100%;
                display: flex;
                flex-direction: column;
            }
            #toolbar {
                height: 58px;
                min-height: 58px;
                background: var(--panel);
                display: flex;
                align-items: center;
                gap: 7px;
                padding: 0 10px;
                border-bottom: 1px solid #3e5668;
                box-shadow: 0 2px 12px rgba(0, 0, 0, 0.18);
                z-index: 20;
            }
            .toolGroup {
                display: flex;
                align-items: center;
                gap: 6px;
                padding-right: 8px;
                border-right: 1px solid #466175;
            }
            .toolGroup:last-child {
                border-right: 0;
            }
            button {
                appearance: none;
                border: 0;
                background: var(--panel2);
                color: var(--text);
                padding: 8px 11px;
                border-radius: 7px;
                font-size: 13px;
                cursor: pointer;
            }
            button:hover {
                filter: brightness(1.12);
            }
            button.active {
                outline: 2px solid var(--accent);
                background: #3d647e;
            }
            button.danger {
                background: var(--danger);
            }
            .title {
                font-weight: 700;
                margin: 0 6px 0 2px;
                font-size: 14px;
                white-space: nowrap;
            }
            #main {
                display: flex;
                min-height: 0;
                flex: 1;
            }
            #palette {
                width: 190px;
                background: #203547;
                border-right: 1px solid #385166;
                padding: 12px;
                overflow: auto;
                z-index: 10;
            }
            #palette h3 {
                font-size: 12px;
                text-transform: uppercase;
                letter-spacing: 0.08em;
                color: #a6b9c7;
                margin: 7px 4px 9px;
            }
            .paletteItem {
                width: 100%;
                margin: 5px 0;
                text-align: left;
                background: #2a465b;
                border: 1px solid #3e5d73;
                padding: 9px 10px;
                border-radius: 7px;
            }
            .paletteItem small {
                display: block;
                color: #a8bbc8;
                margin-top: 2px;
            }
            #workspace {
                position: relative;
                flex: 1;
                min-width: 0;
                min-height: 0;
                background: #fff;
            }
            #svg {
                width: 100%;
                height: 100%;
                display: block;
                user-select: none;
                cursor: grab;
                background: #fff;
            }
            #svg.panning {
                cursor: grabbing;
            }
            #status {
                position: absolute;
                right: 12px;
                bottom: 12px;
                background: rgba(28, 45, 59, 0.9);
                padding: 7px 10px;
                border-radius: 7px;
                font-size: 12px;
                color: #dce7ee;
                pointer-events: none;
            }
            #selectionBox {
                fill: rgba(0, 185, 223, 0.08);
                stroke: #00aacc;
                stroke-width: 1.2;
                stroke-dasharray: 6 4;
            }
            .wire {
                fill: none;
                stroke: var(--wire);
                stroke-width: 3;
                pointer-events: stroke;
                cursor: pointer;
            }
            .wire.selected {
                stroke: var(--accent);
                stroke-width: 4;
            }
            .wireHit {
                fill: none;
                stroke: transparent;
                stroke-width: 14;
                pointer-events: stroke;
                cursor: pointer;
            }
            .node {
                cursor: move;
            }
            .node.selected .body {
                stroke: var(--accent);
                stroke-width: 3;
            }
            .body {
                fill: var(--gate);
                stroke: var(--gateStroke);
                stroke-width: 2;
            }
            .node text {
                font-size: 12px;
                fill: #fff;
                pointer-events: none;
                text-anchor: middle;
            }

            .node .ioLabelText {
                font-size: 12px;
                font-weight: 750;
                fill: #eaf5f8;
                text-anchor: middle;
                dominant-baseline: middle;
                pointer-events: none;
            }

            .node .ioValueText {
                font-size: 12px;
                font-weight: 800;
                fill: var(--ioValueText);
                text-anchor: middle;
                dominant-baseline: middle;
                pointer-events: none;
            }

            .ioValueText {
                font-size: 12px;
                font-weight: 800;
                fill: var(--ioValueText);
                text-anchor: middle;
                pointer-events: none;
            }

            .ioValuePart {
                fill: var(--ioValueBg);
                stroke: var(--ioValueStroke);
                stroke-width: 1;
                cursor: pointer;
            }

            .ioValuePart:hover {
                filter: brightness(0.9);
            }

            .ioValuePart.readonly {
                cursor: default;
            }

            .componentPortLabel {
                font-size: 11px;
                font-weight: 700;
                fill: #34576d;
                pointer-events: none;
                dominant-baseline: middle;
            }

            .inputLabel {
                text-anchor: start;
            }

            .outputLabel {
                text-anchor: end;
            }

            .node .subtext {
                font-size: 10px;
                fill: #bed0dc;
            }
            .componentTitle {
                font-size: 12px;
                font-weight: 700;
                fill: #fff;
                text-anchor: middle;
                pointer-events: none;
            }
            .portLabel {
                font-size: 10px;
                fill: #26343f;
                font-weight: 600;
                pointer-events: none;
            }

            .port {
                fill: #fff;
                stroke: #1b252c;
                stroke-width: 2;
                cursor: crosshair;
            }
            .port.out {
                fill: #dbe8ef;
            }
            .port.connected {
                fill: #9fdcf0;
            }
            .port:hover {
                fill: var(--accent);
            }
            .wireLabel {
                fill: #fff;
                stroke: #9eacb7;
                stroke-width: 1.2;
                paint-order: stroke;
                font-size: 11px;
                font-weight: 600;
                pointer-events: none;
            }
            .wireLabelBg {
                fill: #fff;
                opacity: 0.92;
                rx: 4;
            }
            .textInput {
                position: absolute;
                display: none;
                z-index: 30;
                width: 62px;
                height: 28px;
                background: #f7fbfd;
                border: 2px solid var(--accent);
                border-radius: 7px;
                padding: 4px 7px;
                color: #18323f;
                text-align: center;
                font:
                    700 12px Inter,
                    system-ui,
                    sans-serif;
                box-shadow: 0 5px 18px rgba(24, 51, 64, 0.22);
                outline: none;
            }

            .valuePickerOptions {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 8px;
                margin-top: 12px;
            }

            .valueOption {
                min-height: 48px;
                border: 1px solid #6f8ea1;
                background: #2d495d;
                color: #eff7fa;
                border-radius: 9px;
                font-weight: 750;
                text-align: center;
                padding: 8px;
            }

            .valueOption:hover,
            .valueOption:focus-visible {
                outline: 2px solid var(--accent);
                background: #3b6177;
            }

            .dialogMuted {
                color: #b8c9d3;
                font-size: 12px;
                line-height: 1.4;
                margin: 0;
            }
            #componentBar {
                display: flex;
                gap: 6px;
                flex-wrap: wrap;
            }
            .componentBtn {
                background: #37556b;
            }
            .hint {
                font-size: 11px;
                line-height: 1.35;
                color: #a9bcc8;
                margin: 6px 3px 12px;
            }
            dialog {
                border: 1px solid #597287;
                border-radius: 10px;
                padding: 18px;
                background: #203547;
                color: #fff;
                box-shadow: 0 16px 50px rgba(0, 0, 0, 0.45);
                width: 360px;
            }
            dialog::backdrop {
                background: rgba(0, 0, 0, 0.35);
            }
            dialog input {
                width: 100%;
                padding: 9px;
                border-radius: 6px;
                border: 1px solid #60788c;
                background: #152734;
                color: #fff;
            }
            dialog .row {
                display: flex;
                gap: 7px;
                justify-content: flex-end;
                margin-top: 13px;
            }
            .pill {
                font-size: 11px;
                padding: 3px 6px;
                background: #3a5c72;
                border-radius: 999px;
                color: #dbe7ed;
            }
        </style>
    </head>
    <body>
        <div id="app">
            <div id="toolbar">
                <div class="toolGroup">
                    <div class="title">Logic Editor</div>
                </div>
                <div class="toolGroup">
                    <button data-add="AND">AND</button>
                    <button data-add="OR">OR</button>
                    <button data-add="NOT">NOT</button>
                </div>
                <div class="toolGroup">
                    <button data-add="INPUT">Input</button>
                    <button data-add="OUTPUT">Output</button>
                </div>
                <div class="toolGroup">
                    <button id="saveComponent">Save component</button>
                    <button id="deleteBtn" class="danger">Delete</button>
                </div>
                <div class="toolGroup">
                    <button id="zoomOut">−</button>
                    <button id="zoomReset">100%</button>
                    <button id="zoomIn">+</button>
                    <button id="fitBtn">Fit</button>
                </div>
                <div class="toolGroup">
                    <button id="saveLocal">Save</button>
                    <button id="loadLocal">Load</button>
                    <button id="exportBtn">Export</button>
                    <button id="importBtn">Import</button>
                </div>
            </div>

            <div id="main">
                <aside id="palette">
                    <h3>Components</h3>
                    <div id="componentBar"></div>
                </aside>

                <section id="workspace">
                    <svg id="svg"></svg>
                    <div id="status">Zoom 100%</div>
                    <input
                        id="inlineLabel"
                        class="textInput"
                        autocomplete="off"
                    />
                </section>
            </div>
        </div>

        <dialog id="nameDialog">
            <form method="dialog" id="nameForm">
                <h3 style="margin: 0 0 12px">Save component</h3>
                <p style="font-size: 12px; color: #afc1cd; margin-top: 0">
                    Selected gates will be stored as a reusable component.
                    Input/output nodes form its external interface.
                </p>
                <input
                    id="componentName"
                    placeholder="e.g. Full Adder"
                    required
                />
                <div class="row">
                    <button value="cancel">Cancel</button>
                    <button id="confirmSave" value="default">
                        Save component
                    </button>
                </div>
            </form>
        </dialog>

        <dialog id="valueDialog">
            <form method="dialog" id="valueForm">
                <h3 id="valueDialogTitle" style="margin: 0 0 6px">
                    Select input value
                </h3>
                <p id="valueDialogHint" class="dialogMuted">
                    Choose the value for this input.
                </p>
                <div id="valuePickerOptions" class="valuePickerOptions"></div>
                <div class="row">
                    <button value="cancel">Cancel</button>
                </div>
            </form>
        </dialog>

        <input
            type="file"
            id="fileInput"
            accept=".json,application/json"
            style="display: none"
        />

        <script>
            const svg = document.getElementById("svg");
            const workspace = document.getElementById("workspace");
            const statusEl = document.getElementById("status");
            const inlineLabel = document.getElementById("inlineLabel");
            const valueDialog = document.getElementById("valueDialog");
            const valuePickerOptions =
                document.getElementById("valuePickerOptions");

            const state = {
                nodes: [],
                wires: [],
                selected: new Set(),
                selectedWire: null,
                tool: "select",
                pan: { x: 0, y: 0 },
                zoom: 1,
                components: [],
                connecting: null,
                mouseWorld: { x: 0, y: 0 },
                isPanning: false,
                panStart: null,
                drag: null,
                rubberBand: null,
                valuePickerNodeId: null,
            };

            const NODE_W = 75;
            const IO_NODE_W = 125;
            const NODE_H = 50;
            const COMPONENT_W = 150;
            const GRID = 12.5;
			const PORT_LABEL_MARGIN = 25;

            const gateInputs = { AND: 2, OR: 2, NOT: 1, INPUT: 0, OUTPUT: 1 };
            const gateOutputs = { AND: 1, OR: 1, NOT: 1, INPUT: 1, OUTPUT: 0 };

            /*
             * All circuit values are opaque to the editor. To change the circuit
             * from bits to another value domain, replace this object rather than
             * rewriting rendering, persistence, wiring, or simulation.
             */
            const valueBehaviour = {
                defaultValue: 0,

                normalise(value) {
                    return value === 1 ? 1 : 0;
                },

                clone(value) {
                    return value;
                },

                equals(a, b) {
                    return Object.is(a, b);
                },

                display(value) {
                    return String(value);
                },

                isActive(value) {
                    return value !== 0;
                },

                options() {
                    return [
                        { value: 0, label: "0" },
                        { value: 1, label: "1" },
                    ];
                },

                and(values) {
                    return values.length
                        ? values.reduce(
                              (acc, value) => (acc && value ? 1 : 0),
                              1,
                          )
                        : 0;
                },

                or(values) {
                    return values.some((value) => value !== 0) ? 1 : 0;
                },

                not(value) {
                    return value === 0 ? 1 : 0;
                },

                passthrough(value) {
                    return value;
                },

                defaultOutput() {
                    return this.defaultValue;
                },
            };

            function valueDefault() {
                return valueBehaviour.clone(valueBehaviour.defaultValue);
            }

            function normaliseValue(value) {
                return valueBehaviour.normalise(value);
            }

            function displayValue(value) {
                return value + "";
            }

            function sameValue(a, b) {
                return valueBehaviour.equals(a, b);
            }

            function displayValue(value) {
                return valueBehaviour.display(value);
            }

            function sourceValue(node, output = 0) {
                if (!node) return valueDefault();
                if (isComponent(node))
                    return valueBehaviour.clone(
                        (node._runtimeOutputs || [valueDefault()])[output] ??
                            valueDefault(),
                    );
                return valueBehaviour.clone(node.value ?? valueDefault());
            }

            function evaluateGate(type, inputs) {
                switch (type) {
                    case "AND":
                        return valueBehaviour.and(inputs);
                    case "OR":
                        return valueBehaviour.or(inputs);
                    case "NOT":
                        return valueBehaviour.not(inputs[0] ?? valueDefault());
                    default:
                        return valueBehaviour.passthrough(
                            inputs[0] ?? valueDefault(),
                        );
                }
            }

            function uid(prefix = "id") {
                return (
                    prefix +
                    "_" +
                    Math.random().toString(36).slice(2, 10) +
                    "_" +
                    Date.now().toString(36)
                );
            }
            function snap(v) {
                return Math.round(v / GRID) * GRID;
            }
            function componentById(id) {
                return state.components.find((c) => c.id === id);
            }
            function nodeById(id) {
                return state.nodes.find((n) => n.id === id);
            }
            function isComponent(n) {
                return n && n.type === "COMPONENT";
            }
            function inputCount(n) {
                return isComponent(n)
                    ? ((componentById(n.componentId) || {}).inputLabels || [])
                          .length
                    : gateInputs[n.type] || 0;
            }
            function outputCount(n) {
                return isComponent(n)
                    ? ((componentById(n.componentId) || {}).outputLabels || [])
                          .length
                    : gateOutputs[n.type] || 0;
            }
            function nodeHeight(n) {
                const count = Math.max(inputCount(n), outputCount(n));
                return Math.max(NODE_H, 25 + Math.max(0, count - 1) * 25);
            }
            function nodeWidth(n) {
                if (n.type === "INPUT" || n.type === "OUTPUT") return IO_NODE_W;
                return isComponent(n) ? COMPONENT_W : NODE_W;
            }

            function ioLabelWidth(n) {
                return Math.round(nodeWidth(n) * 0.55);
            }

            function ioValueWidth(n) {
                return nodeWidth(n) - ioLabelWidth(n);
            }
            function portY(n, index, count) {
                if (count <= 1) return n.y + nodeHeight(n) / 2;
                const pad = 12.5,
                    h = nodeHeight(n) - 2 * pad;
                return n.y + pad + index * (h / (count - 1));
            }
            function nodeInputY(n, index) {
                return portY(n, index, inputCount(n));
            }
            function nodeOutputY(n, index) {
                return portY(n, index, outputCount(n));
            }
            function nodeInput(n, index) {
                return { x: n.x, y: nodeInputY(n, index) };
            }
            function nodeOutput(n, index = 0) {
                return { x: n.x + nodeWidth(n), y: nodeOutputY(n, index) };
            }

            function svgPoint(evt) {
                const r = svg.getBoundingClientRect();
                return {
                    x: (evt.clientX - r.left - state.pan.x) / state.zoom,
                    y: (evt.clientY - r.top - state.pan.y) / state.zoom,
                };
            }
            function worldToScreen(p) {
                return {
                    x: p.x * state.zoom + state.pan.x,
                    y: p.y * state.zoom + state.pan.y,
                };
            }

            function gateShape(type, w, h) {
                if (type === "INPUT" || type === "OUTPUT" || type === "NOT") {
                    return `M 0 0 H ${w - 16} L ${w} ${h / 2} L ${w - 16} ${h} H 0 Z`;
                }
                if (type === "OR") {
                    return `M 0 0 C 28 0, 55 ${Math.max(8, h * 0.16)}, ${w} ${h / 2}
        C 55 ${h - Math.max(8, h * 0.16)}, 28 ${h}, 0 ${h}
        C 17 ${h - 10}, 17 10, 0 0 Z`;
                }
                if (type === "AND") {
                    return `M 0 0 H ${w / 2} C ${w - 4} 0, ${w} 11, ${w} ${h / 2}
        C ${w} ${h - 11}, ${w - 4} ${h}, ${w / 2} ${h} H 0 Z`;
                }
                return `M 7 0 H ${w - 7} Q ${w} 0 ${w} 7 V ${h - 7} Q ${w} ${h} ${w - 7} ${h}
        H 7 Q 0 ${h} 0 ${h - 7} V 7 Q 0 0 7 0 Z`;
            }

            function makeNode(type, x, y, extra = {}) {
                const n = {
                    id: uid("node"),
                    type,
                    x: snap(x),
                    y: snap(y),
                    label:
                        type === "INPUT"
                            ? "A"
                            : type === "OUTPUT"
                              ? "OUT"
                              : type,
                    value: valueDefault(),
                    ...extra,
                };
                state.nodes.push(n);
                return n;
            }
            function addNode(type, pos = null) {
                const p = pos || {
                    x: (svg.clientWidth / 2 - state.pan.x) / state.zoom,
                    y: (svg.clientHeight / 2 - state.pan.y) / state.zoom,
                };
                const temp = { type };
                const n = makeNode(
                    type,
                    p.x - nodeWidth(temp) / 2,
                    p.y - nodeHeight(temp) / 2,
                );
                state.selected.clear();
                state.selected.add(n.id);
                render();
                //if (type === "INPUT" || type === "OUTPUT") beginRename(n);
                return n;
            }

            function pathForWire(
                fromNode,
                toNode,
                inputIndex,
                outputIndex = 0,
            ) {
                const a = nodeOutput(fromNode, outputIndex),
                    b = nodeInput(toNode, inputIndex);
                const dx = Math.max(35, (b.x - a.x) * 0.5);
                return `M ${a.x} ${a.y} C ${a.x + dx} ${a.y}, ${b.x - dx} ${b.y}, ${b.x} ${b.y}`;
            }
            /* Simulation of a saved custom component. Its selected INPUT/OUTPUT nodes
               define the external interface; all other selected nodes remain internal. */
            function simulateComponent(comp, externalInputs, stack = []) {
                if (!comp || stack.includes(comp.id))
                    return (comp?.outputLabels || []).map(() => valueDefault());

                const nodes = (comp.nodes || []).map((n, i) => ({
                    ...n,
                    _i: i,
                    value: valueDefault(),
                }));
                const vals = {};
                const inNodes = nodes.filter((n) => n.type === "INPUT");

                inNodes.forEach((n, i) => {
                    vals[n._i] = normaliseValue(
                        externalInputs[i] ?? valueDefault(),
                    );
                    n.value = vals[n._i];
                });

                for (const n of nodes)
                    if (n.type !== "INPUT") vals[n._i] = valueDefault();

                for (let pass = 0; pass < nodes.length * 4 + 4; pass++) {
                    let changed = false;

                    for (const n of nodes) {
                        if (n.type === "INPUT") continue;

                        const ins = Array.from(
                            { length: gateInputs[n.type] || 0 },
                            () => valueDefault(),
                        );

                        for (const w of comp.wires || []) {
                            if (w.toIndex === n._i && w.input < ins.length) {
                                const src = nodes[w.fromIndex];
                                if (src)
                                    ins[w.input] = sourceValue(
                                        src,
                                        w.output || 0,
                                    );
                            }
                        }

                        let next;

                        if (n.type === "OUTPUT") {
                            next = valueBehaviour.passthrough(
                                ins[0] ?? valueDefault(),
                            );
                        } else if (n.type === "COMPONENT") {
                            const child = componentById(n.componentId);
                            const childIn = ins.slice(
                                0,
                                (child?.inputLabels || []).length,
                            );
                            const childOut = simulateComponent(
                                child,
                                childIn,
                                stack.concat(comp.id),
                            );
                            n._outputs = childOut.map((value) =>
                                valueBehaviour.clone(value),
                            );
                            next = childOut[0] ?? valueDefault();
                        } else {
                            next = evaluateGate(n.type, ins);
                        }

                        if (n.type === "COMPONENT") {
                            const outs = n._outputs || [];
                            const old = n._outCache || [];
                            if (
                                outs.length !== old.length ||
                                outs.some(
                                    (value, i) => !sameValue(value, old[i]),
                                )
                            ) {
                                changed = true;
                            }
                            n._outCache = outs.map((value) =>
                                valueBehaviour.clone(value),
                            );
                        }

                        if (!sameValue(next, vals[n._i])) {
                            vals[n._i] = valueBehaviour.clone(next);
                            n.value = valueBehaviour.clone(next);
                            changed = true;
                        }
                    }

                    if (!changed) break;
                }

                return (comp.outputLabels || []).map((_, i) => {
                    const out = nodes.filter((n) => n.type === "OUTPUT")[i];
                    return out
                        ? valueBehaviour.clone(vals[out._i] ?? valueDefault())
                        : valueDefault();
                });
            }

            function recompute() {
                for (const n of state.nodes) {
                    if (n.type !== "INPUT") n.value = valueDefault();
                    else n.value = normaliseValue(n.value);
                    if (isComponent(n)) n._runtimeOutputs = [];
                }

                for (let pass = 0; pass < state.nodes.length + 4; pass++) {
                    let changed = false;

                    for (const n of state.nodes) {
                        if (n.type === "INPUT") continue;

                        const ins = Array.from({ length: inputCount(n) }, () =>
                            valueDefault(),
                        );

                        for (const w of state.wires) {
                            if (w.to === n.id && w.input < ins.length) {
                                const src = nodeById(w.from);
                                if (src)
                                    ins[w.input] = sourceValue(
                                        src,
                                        w.output || 0,
                                    );
                            }
                        }

                        if (isComponent(n)) {
                            const comp = componentById(n.componentId);
                            const outs = simulateComponent(comp, ins);
                            const previous = n._runtimeOutputs || [];
                            if (
                                outs.length !== previous.length ||
                                outs.some(
                                    (value, i) =>
                                        !sameValue(value, previous[i]),
                                )
                            ) {
                                changed = true;
                            }
                            n._runtimeOutputs = outs.map((value) =>
                                valueBehaviour.clone(value),
                            );

                            const next = outs[0] ?? valueDefault();
                            if (!sameValue(next, n.value)) {
                                n.value = valueBehaviour.clone(next);
                                changed = true;
                            }
                        } else {
                            const next =
                                n.type === "OUTPUT"
                                    ? valueBehaviour.passthrough(
                                          ins[0] ?? valueDefault(),
                                      )
                                    : evaluateGate(n.type, ins);

                            if (!sameValue(next, n.value)) {
                                n.value = valueBehaviour.clone(next);
                                changed = true;
                            }
                        }
                    }

                    if (!changed) break;
                }
            }

            function wireValue(w) {
                return sourceValue(nodeById(w.from), w.output || 0);
            }

            function wireColour(w) {
                const a = [98, 104, 110],
                    b = [32, 40, 48],
                    t = wireValue(w);
                const rgb = a.map((x, i) => Math.round(x + (b[i] - x) * t));
                return (
                    "#" +
                    rgb.map((x) => x.toString(16).padStart(2, "0")).join("")
                );
            }

            function inputIoColour(nodeValue) {
                const t = Number(nodeValue);

                const a = [148, 196, 207];
                const b = [81, 151, 167];

                const rgb = a.map((x, i) => Math.round(x + (b[i] - x) * t));

                return (
                    "#" +
                    rgb.map((x) => x.toString(16).padStart(2, "0")).join("")
                );
            }

            function appendText(parent, text, x, y, cls = "") {
                const t = document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "text",
                );
                t.setAttribute("x", x);
                t.setAttribute("y", y);
                if (cls) t.setAttribute("class", cls);
                t.textContent = text;
                parent.appendChild(t);
                return t;
            }

            function render() {
                recompute();
                svg.innerHTML = "";
                const ns = "http://www.w3.org/2000/svg";
                const defs = document.createElementNS(ns, "defs");
                const small = document.createElementNS(ns, "pattern");
                small.setAttribute("id", "grid");
                small.setAttribute("width", GRID);
                small.setAttribute("height", GRID);
                small.setAttribute("patternUnits", "userSpaceOnUse");
                const rect = document.createElementNS(ns, "rect");
                rect.setAttribute("width", GRID);
                rect.setAttribute("height", GRID);
                rect.setAttribute("fill", "#fff");
                const line = document.createElementNS(ns, "path");
                line.setAttribute("d", `M ${GRID} 0 L 0 0 0 ${GRID}`);
                line.setAttribute("fill", "none");
                line.setAttribute("stroke", "#e8edf1");
                line.setAttribute("stroke-width", "1");
                small.append(rect, line);
                defs.appendChild(small);
                svg.appendChild(defs);
                const viewLeft = -state.pan.x / state.zoom;
                const viewTop = -state.pan.y / state.zoom;
                const viewRight = (svg.clientWidth - state.pan.x) / state.zoom;
                const viewBottom =
                    (svg.clientHeight - state.pan.y) / state.zoom;
                const gridX = Math.floor(viewLeft / GRID) * GRID - GRID * 2;
                const gridY = Math.floor(viewTop / GRID) * GRID - GRID * 2;
                const gridW =
                    Math.ceil((viewRight - gridX) / GRID) * GRID + GRID * 2;
                const gridH =
                    Math.ceil((viewBottom - gridY) / GRID) * GRID + GRID * 2;

                const bg = document.createElementNS(ns, "rect");
                bg.setAttribute("x", gridX);
                bg.setAttribute("y", gridY);
                bg.setAttribute("width", gridW);
                bg.setAttribute("height", gridH);
                bg.setAttribute("fill", "url(#grid)");
                bg.setAttribute(
                    "transform",
                    `translate(${state.pan.x},${state.pan.y}) scale(${state.zoom})`,
                );
                svg.appendChild(bg);
                const world = document.createElementNS(ns, "g");
                world.setAttribute(
                    "transform",
                    `translate(${state.pan.x},${state.pan.y}) scale(${state.zoom})`,
                );
                svg.appendChild(world);

                for (const w of state.wires) {
                    const a = nodeById(w.from),
                        b = nodeById(w.to);
                    if (!a || !b) continue;
                    const d = pathForWire(a, b, w.input, w.output || 0);
                    const hit = document.createElementNS(ns, "path");
                    hit.setAttribute("d", d);
                    hit.classList.add("wireHit");
                    hit.addEventListener("click", (e) => {
                        e.stopPropagation();
                        state.selected.clear();
                        state.selectedWire = w.id;
                        render();
                    });
                    world.appendChild(hit);
                    const path = document.createElementNS(ns, "path");
                    path.setAttribute("d", d);
                    path.classList.add("wire");
                    if (state.selectedWire === w.id)
                        path.classList.add("selected");
                    path.style.stroke = wireColour(w);
                    world.appendChild(path);
                    const t0 = nodeOutput(a, w.output || 0),
                        t1 = nodeInput(b, w.input),
                        mx = (t0.x + t1.x) / 2,
                        my = (t0.y + t1.y) / 2;
                    const txt = appendText(
                        world,
                        displayValue(wireValue(w)),
                        mx,
                        my + 3.5,
                        "wireLabel",
                    );
                    const bb = txt.getBBox();
                    const bg2 = document.createElementNS(ns, "rect");
                    bg2.setAttribute("x", bb.x - 2.5);
                    bg2.setAttribute("y", bb.y);
                    bg2.setAttribute("width", bb.width + 5);
                    bg2.setAttribute("height", bb.height);
                    bg2.setAttribute("class", "wireLabelBg");
                    world.appendChild(bg2);
                    txt.remove();
                    world.appendChild(txt);
                }

                if (state.connecting) {
                    const n = nodeById(state.connecting.nodeId),
                        out = nodeOutput(n, state.connecting.output || 0),
                        b = state.mouseWorld;
                    if (n) {
                        const p = document.createElementNS(ns, "path");
                        p.setAttribute(
                            "d",
                            `M ${out.x} ${out.y} C ${(out.x + b.x) / 2} ${out.y}, ${(out.x + b.x) / 2} ${b.y}, ${b.x} ${b.y}`,
                        );
                        p.classList.add("wire", "selected");
                        p.setAttribute("stroke-dasharray", "7 5");
                        world.appendChild(p);
                    }
                }

                for (const n of state.nodes) {
                    const g = document.createElementNS(ns, "g");
                    n.displayObject = g;
                    g.classList.add("node");
                    if (state.selected.has(n.id)) g.classList.add("selected");
                    g.setAttribute("transform", `translate(${n.x},${n.y})`);
                    g.dataset.id = n.id;
                    const w = nodeWidth(n),
                        h = nodeHeight(n);
                    const body = document.createElementNS(ns, "path");
                    body.setAttribute("d", gateShape(n.type, w, h));
                    body.classList.add("body");
                    body.setAttribute("fill", "#353229");
                    g.appendChild(body);

                    if (n.type === "INPUT" || n.type === "OUTPUT") {
                        const labelW = ioLabelWidth(n);
                        const valueW = ioValueWidth(n);
                        const clipId = uid("ioClip");
                        const clip = document.createElementNS(ns, "clipPath");
                        clip.setAttribute("id", clipId);
                        const clipPath = document.createElementNS(ns, "path");
                        clipPath.setAttribute("d", gateShape(n.type, w, h));
                        clip.appendChild(clipPath);
                        defs.appendChild(clip);

                        const io = document.createElementNS(ns, "g");
                        io.setAttribute("clip-path", `url(#${clipId})`);

                        const labelBg = document.createElementNS(ns, "rect");
                        labelBg.setAttribute("x", 0);
                        labelBg.setAttribute("y", 0);
                        labelBg.setAttribute("width", labelW);
                        labelBg.setAttribute("height", h);
                        labelBg.setAttribute("fill", "#353229");
                        io.appendChild(labelBg);

                        const valuePart = document.createElementNS(ns, "rect");
                        valuePart.setAttribute("x", labelW);
                        valuePart.setAttribute("y", 0);
                        valuePart.setAttribute("width", valueW);
                        valuePart.setAttribute("height", h);
                        valuePart.classList.add("ioValuePart");
                        if (n.type === "OUTPUT")
                            valuePart.classList.add("readonly");
                        valuePart.style.fill = inputIoColour(n.value);
                        io.appendChild(valuePart);

                        const divider = document.createElementNS(ns, "line");
                        divider.setAttribute("x1", labelW);
                        divider.setAttribute("x2", labelW);
                        divider.setAttribute("y1", 4);
                        divider.setAttribute("y2", h - 4);
                        divider.classList.add("ioDivider");
                        io.appendChild(divider);

                        g.appendChild(io);

                        const labelText = appendText(
                            g,
                            n.label,
                            labelW / 2,
                            h / 2,
                            "ioLabelText",
                        );

                        const valueText = appendText(
                            g,
                            displayValue(n.value),
                            labelW + valueW / 2,
                            h / 2,
                            "ioValueText",
                        );

                        labelText.addEventListener("dblclick", (e) => {
                            e.stopPropagation();
                            beginRename(n);
                        });
                        labelBg.addEventListener("dblclick", (e) => {
                            e.stopPropagation();
                            beginRename(n);
                        });

                        if (n.type === "INPUT") {
                            valuePart.addEventListener("mousedown", (e) => {
                                e.stopPropagation();
                            });
                            valuePart.addEventListener("click", (e) => {
                                e.stopPropagation();
                                beginValuePicker(n);
                            });
                        }
                    } else if (n.type === "COMPONENT") {
                        const comp = componentById(n.componentId);
                        const ins = comp?.inputLabels || [];
                        const outs = comp?.outputLabels || [];

                        // Component name — kept in the centre/top area
                        appendText(
                            g,
                            n.componentName || comp?.name || "Component",
                            w / 2,
                            14,
                            "componentTitle",
                        );

                        // Input labels — inside the left edge
                        ins.forEach((label, i) => {
                            const t = appendText(
                                g,
                                label,
                                14,
                                nodeInputY(n, i) - n.y,
                                "componentPortLabel inputLabel",
                            );

                            t.setAttribute("text-anchor", "start");
                        });

                        outs.forEach((label, i) => {
                            const t = appendText(
                                g,
                                label,
                                w - PORT_LABEL_MARGIN,
                                nodeOutputY(n, i) - n.y,
                                "componentPortLabel outputLabel",
                            );

                            t.setAttribute("text-anchor", "end");
                        });
                    } else {
                        appendText(g, n.type, w / 2, h / 2 + 4, "");
                    }

                    const ic = inputCount(n);
                    for (let i = 0; i < ic; i++) {
                        const c = document.createElementNS(ns, "circle");
                        c.setAttribute("cx", 0);
                        c.setAttribute("cy", nodeInputY(n, i) - n.y);
                        c.setAttribute("r", 5);
                        c.classList.add("port");
                        if (
                            state.wires.some(
                                (x) => x.to === n.id && x.input === i,
                            )
                        )
                            c.classList.add("connected");
                        c.addEventListener("mousedown", (e) => {
                            e.stopPropagation();
                            if (state.connecting) connectToInput(n, i);
                        });
                        c.addEventListener("click", (e) => e.stopPropagation());
                        g.appendChild(c);
                    }
                    const oc = outputCount(n);
                    for (let i = 0; i < oc; i++) {
                        const c = document.createElementNS(ns, "circle");
                        c.setAttribute("cx", w);
                        c.setAttribute("cy", nodeOutputY(n, i) - n.y);
                        c.setAttribute("r", 5);
                        c.classList.add("port", "out");
                        c.addEventListener("mousedown", (e) => {
                            e.stopPropagation();
                            startConnection(n, i);
                        });
                        c.addEventListener("click", (e) => e.stopPropagation());
                        g.appendChild(c);
                    }

                    if (n.type === "INPUT") {
                        g.addEventListener("dblclick", (e) => {
                            e.stopPropagation();
                            beginRename(n);
                        });
                    }
                    if (n.type === "OUTPUT") {
                        g.addEventListener("dblclick", (e) => {
                            e.stopPropagation();
                            beginRename(n);
                        });
                    }
                    g.addEventListener("mousedown", (e) => nodeMouseDown(e, n));
                    world.appendChild(g);
                }

                if (state.rubberBand) {
                    const r = state.rubberBand,
                        box = document.createElementNS(ns, "rect");
                    box.setAttribute("x", Math.min(r.x0, r.x1));
                    box.setAttribute("y", Math.min(r.y0, r.y1));
                    box.setAttribute("width", Math.abs(r.x1 - r.x0));
                    box.setAttribute("height", Math.abs(r.y1 - r.y0));
                    box.setAttribute("id", "selectionBox");
                    world.appendChild(box);
                }
                statusEl.textContent = `Zoom ${Math.round(state.zoom * 100)}%  |  Nodes ${state.nodes.length}  |  Wires ${state.wires.length}`;
            }

            function startConnection(node, output = 0) {
                if (outputCount(node) <= output) return;
                state.connecting = { nodeId: node.id, output };
                state.tool = "wire";
                render();
            }
            function connectToInput(target, inputIndex) {
                if (!state.connecting || inputIndex >= inputCount(target))
                    return;
                const source = state.connecting.nodeId,
                    output = state.connecting.output || 0;
                if (source === target.id) return;
                state.wires = state.wires.filter(
                    (w) => !(w.to === target.id && w.input === inputIndex),
                );
                state.wires.push({
                    id: uid("wire"),
                    from: source,
                    to: target.id,
                    input: inputIndex,
                    output,
                });
                state.connecting = null;
                state.selectedWire = null;
                state.tool = "select";
                render();
            }
            function nodeMouseDown(e, n) {
                if (e.button === 1) return; // middle handled as pan
                e.stopPropagation();

                if (e.shiftKey) {
                    if (state.selected.has(n.id)) state.selected.delete(n.id);
                    else state.selected.add(n.id);
                } else if (!state.selected.has(n.id)) {
                    state.selected.forEach((m) =>
                        nodeById(m).displayObject.classList.remove("selected"),
                    );
                    state.selected.clear();
                    state.selected.add(n.id);
                }

                const p = svgPoint(e);
                state.drag = {
                    origin: { x: p.x, y: p.y },
                    positions: [...state.selected].map((id) => {
                        const q = nodeById(id);
                        return { id, x: q.x, y: q.y };
                    }),
                };
                state.selectedWire = null;
                if (state.selected.has(n.id))
                    n.displayObject.classList.add("selected");
                //render();
            }

            svg.addEventListener("mousedown", (e) => {
                if (e.button === 1 || e.altKey || e.code === "Space") {
                    state.isPanning = true;
                    state.panStart = {
                        x: e.clientX,
                        y: e.clientY,
                        px: state.pan.x,
                        py: state.pan.y,
                    };
                    svg.classList.add("panning");
                    return;
                }
                if (state.connecting) {
                    state.connecting = null;
                    state.tool = "select";
                    render();
                    return;
                }
                if (e.shiftKey) return;
                const p = svgPoint(e);
                state.selected.clear();
                state.selectedWire = null;
                state.rubberBand = { x0: p.x, y0: p.y, x1: p.x, y1: p.y };
                render();
            });
            window.addEventListener("mousemove", (e) => {
                const p = svgPoint(e);
                state.mouseWorld = p;
                if (state.isPanning) {
                    state.pan.x =
                        state.panStart.px + (e.clientX - state.panStart.x);
                    state.pan.y =
                        state.panStart.py + (e.clientY - state.panStart.y);
                    render();
                    return;
                }
                if (state.drag) {
                    const dx = p.x - state.drag.origin.x,
                        dy = p.y - state.drag.origin.y;
                    for (const item of state.drag.positions) {
                        const n = nodeById(item.id);
                        n.x = snap(item.x + dx);
                        n.y = snap(item.y + dy);
                    }
                    render();
                    return;
                }
                if (state.rubberBand) {
                    state.rubberBand.x1 = p.x;
                    state.rubberBand.y1 = p.y;
                    render();
                    return;
                }
                if (state.connecting) render();
            });
            window.addEventListener("mouseup", () => {
                if (state.isPanning) {
                    state.isPanning = false;
                    svg.classList.remove("panning");
                }
                state.drag = null;
                if (state.rubberBand) {
                    const r = state.rubberBand,
                        x0 = Math.min(r.x0, r.x1),
                        x1 = Math.max(r.x0, r.x1),
                        y0 = Math.min(r.y0, r.y1),
                        y1 = Math.max(r.y0, r.y1);
                    if (Math.abs(x1 - x0) > 5 || Math.abs(y1 - y0) > 5) {
                        state.selected.clear();
                        for (const n of state.nodes)
                            if (
                                n.x >= x0 &&
                                n.x + nodeWidth(n) <= x1 &&
                                n.y >= y0 &&
                                n.y + nodeHeight(n) <= y1
                            )
                                state.selected.add(n.id);
                    }
                    state.rubberBand = null;
                    render();
                }
            });
            svg.addEventListener(
                "wheel",
                (e) => {
                    e.preventDefault();
                    const before = svgPoint(e),
                        factor = e.deltaY < 0 ? 1.1 : 1 / 1.1,
                        next = Math.max(
                            0.125,
                            Math.min(3, state.zoom * factor),
                        );
                    state.pan.x =
                        e.clientX -
                        svg.getBoundingClientRect().left -
                        before.x * next;
                    state.pan.y =
                        e.clientY -
                        svg.getBoundingClientRect().top -
                        before.y * next;
                    state.zoom = next;
                    render();
                },
                { passive: false },
            );

            function setZoom(z) {
                z = Math.max(0.125, Math.min(3, z));
                const cx = svg.clientWidth / 2,
                    cy = svg.clientHeight / 2;
                const world = {
                    x: (cx - state.pan.x) / state.zoom,
                    y: (cy - state.pan.y) / state.zoom,
                };
                state.zoom = z;
                state.pan.x = cx - world.x * z;
                state.pan.y = cy - world.y * z;
                render();
            }
            document.getElementById("zoomIn").onclick = () =>
                setZoom(state.zoom * 1.2);
            document.getElementById("zoomOut").onclick = () =>
                setZoom(state.zoom / 1.2);
            document.getElementById("zoomReset").onclick = () => setZoom(1);
            document.getElementById("fitBtn").onclick = () => {
                if (!state.nodes.length) {
                    state.pan = { x: 0, y: 0 };
                    state.zoom = 1;
                    render();
                    return;
                }
                const minX = Math.min(...state.nodes.map((n) => n.x)),
                    minY = Math.min(...state.nodes.map((n) => n.y));
                const maxX = Math.max(
                        ...state.nodes.map((n) => n.x + nodeWidth(n)),
                    ),
                    maxY = Math.max(
                        ...state.nodes.map((n) => n.y + nodeHeight(n)),
                    );
                const w = maxX - minX + 100,
                    h = maxY - minY + 100;
                state.zoom = Math.max(
                    0.125,
                    Math.min(
                        2.5,
                        Math.min(svg.clientWidth / w, svg.clientHeight / h),
                    ),
                );
                state.pan.x =
                    svg.clientWidth / 2 - ((minX + maxX) / 2) * state.zoom;
                state.pan.y =
                    svg.clientHeight / 2 - ((minY + maxY) / 2) * state.zoom;
                render();
            };
            document
                .querySelectorAll("[data-add]")
                .forEach(
                    (btn) => (btn.onclick = () => addNode(btn.dataset.add)),
                );

            document.getElementById("deleteBtn").onclick = () => {
                const ids = new Set(state.selected);
                if (state.selectedWire) {
                    state.wires = state.wires.filter(
                        (w) => w.id !== state.selectedWire,
                    );
                    state.selectedWire = null;
                }
                if (ids.size) {
                    state.nodes = state.nodes.filter((n) => !ids.has(n.id));
                    state.wires = state.wires.filter(
                        (w) => !ids.has(w.from) && !ids.has(w.to),
                    );
                    state.selected.clear();
                }
                render();
            };

            function beginRename(n) {
                const s = worldToScreen({
                        x: n.x + ioLabelWidth(n) / 2,
                        y: n.y + nodeHeight(n) / 2,
                    }),
                    wr = workspace.getBoundingClientRect(),
                    width = Math.max(52, ioLabelWidth(n) * state.zoom - 8);

                inlineLabel.style.width = `${width}px`;
                inlineLabel.style.left = `${s.x - width / 2}px`;
                inlineLabel.style.top = `${s.y - 14}px`;
                inlineLabel.style.display = "block";
                inlineLabel.value = n.label;
                inlineLabel.focus();
                inlineLabel.select();

                const commit = () => {
                    n.label = inlineLabel.value.trim() || n.label;
                    inlineLabel.style.display = "none";
                    render();
                };

                inlineLabel.onblur = commit;
                inlineLabel.onkeydown = (e) => {
                    if (e.key === "Enter") {
                        e.preventDefault();
                        inlineLabel.blur();
                    }
                    if (e.key === "Escape") {
                        inlineLabel.value = n.label;
                        inlineLabel.blur();
                    }
                };
            }

            function beginValuePicker(n) {
                if (!n || n.type !== "INPUT") return;

                state.valuePickerNodeId = n.id;
                valuePickerOptions.innerHTML = "";

                for (const option of valueBehaviour.options()) {
                    const button = document.createElement("button");
                    button.type = "button";
                    button.className = "valueOption";
                    button.textContent = option.label;
                    button.onclick = () => {
                        n.value = valueBehaviour.clone(option.value);
                        state.valuePickerNodeId = null;
                        valueDialog.close();
                        render();
                    };
                    valuePickerOptions.appendChild(button);
                }

                valueDialog.showModal();

                const first = valuePickerOptions.querySelector("button");
                if (first) first.focus();
            }

            valueDialog.addEventListener("close", () => {
                state.valuePickerNodeId = null;
            });

            valueDialog.addEventListener("click", (e) => {
                if (e.target === valueDialog) valueDialog.close();
            });

            /* Save the selected circuit as ONE reusable component. INPUT and OUTPUT nodes become its external interface; the internal gates are hidden. */
            document.getElementById("saveComponent").onclick = () => {
                if (!state.selected.size) {
                    alert("Select the nodes that make up the component first.");
                    return;
                }
                document.getElementById("componentName").value = "";
                document.getElementById("nameDialog").showModal();
                setTimeout(
                    () => document.getElementById("componentName").focus(),
                    50,
                );
            };
            document
                .getElementById("nameForm")
                .addEventListener("submit", (e) => {
                    e.preventDefault();
                    const name = document
                        .getElementById("componentName")
                        .value.trim();
                    if (!name) return;
                    const ids = new Set(state.selected),
                        chosen = state.nodes.filter((n) => ids.has(n.id));
                    if (!chosen.length) return;
                    const inputs = chosen.filter((n) => n.type === "INPUT"),
                        outputs = chosen.filter((n) => n.type === "OUTPUT");
                    if (!inputs.length && !outputs.length) {
                        alert(
                            "A component needs at least one Input or Output node.",
                        );
                        return;
                    }
                    const minX = Math.min(...chosen.map((n) => n.x)),
                        minY = Math.min(...chosen.map((n) => n.y));
                    const comp = {
                        id: uid("comp"),
                        name,
                        inputLabels: inputs.map((n) => n.label),
                        outputLabels: outputs.map((n) => n.label),
                        nodes: chosen.map((n) => ({
                            type: n.type,
                            x: n.x - minX,
                            y: n.y - minY,
                            label: n.label,
                            value: n.value,
                            componentId: n.componentId,
                        })),
                        wires: state.wires
                            .filter((w) => ids.has(w.from) && ids.has(w.to))
                            .map((w) => {
                                const from = state.nodes.find(
                                        (n) => n.id === w.from,
                                    ),
                                    to = state.nodes.find((n) => n.id === w.to);
                                return {
                                    fromIndex: chosen.indexOf(from),
                                    toIndex: chosen.indexOf(to),
                                    input: w.input,
                                    output: w.output || 0,
                                };
                            }),
                    };
                    state.components.push(comp);
                    persist();
                    renderComponents();
                    document.getElementById("nameDialog").close();
                });

            /* Replace the selected circuit with a single component instance. */
            function replaceSelectionWithComponent(comp) {
                const ids = new Set(state.selected),
                    chosen = state.nodes.filter((n) => ids.has(n.id));
                if (!chosen.length) return;
                const minX = Math.min(...chosen.map((n) => n.x)),
                    minY = Math.min(...chosen.map((n) => n.y));
                const maxX = Math.max(...chosen.map((n) => n.x + nodeWidth(n))),
                    maxY = Math.max(...chosen.map((n) => n.y + nodeHeight(n)));
                const n = makeNode("COMPONENT", minX, minY, {
                    componentId: comp.id,
                    componentName: comp.name,
                    label: comp.name,
                });
                // Preserve any external wires by mapping wires crossing the selection to component ports.
                const inNodes = chosen.filter((x) => x.type === "INPUT"),
                    outNodes = chosen.filter((x) => x.type === "OUTPUT");
                const inMap = new Map(inNodes.map((x, i) => [x.id, i])),
                    outMap = new Map(outNodes.map((x, i) => [x.id, i]));
                const newWires = [];
                for (const w of state.wires) {
                    const fromInside = ids.has(w.from),
                        toInside = ids.has(w.to);
                    if (fromInside && !toInside) {
                        const o = outMap.get(w.from);
                        if (o !== undefined)
                            newWires.push({ ...w, from: n.id, output: o });
                    } else if (!fromInside && toInside) {
                        const i = inMap.get(w.to);
                        if (i !== undefined)
                            newWires.push({ ...w, to: n.id, input: i });
                    } else if (!fromInside && !toInside) newWires.push(w);
                }
                state.nodes = state.nodes.filter((x) => !ids.has(x.id));
                state.wires = newWires;
                state.selected.clear();
                state.selected.add(n.id);
                render();
            }
            function placeComponent(comp, pos) {
                const p = pos || {
                    x: (svg.clientWidth / 2 - state.pan.x) / state.zoom,
                    y: (svg.clientHeight / 2 - state.pan.y) / state.zoom,
                };
                const n = makeNode(
                    "COMPONENT",
                    p.x - COMPONENT_W / 2,
                    p.y -
                        nodeHeight({
                            type: "COMPONENT",
                            componentId: comp.id,
                        }) /
                            2,
                    {
                        componentId: comp.id,
                        componentName: comp.name,
                        label: comp.name,
                    },
                );
                state.selected.clear();
                state.selected.add(n.id);
                render();
            }
            function renderComponents() {
                const bar = document.getElementById("componentBar");
                bar.innerHTML = "";
                if (!state.components.length) {
                    const e = document.createElement("div");
                    e.className = "hint";
                    e.textContent = "No custom components saved.";
                    bar.appendChild(e);
                    return;
                }
                for (const comp of state.components) {
                    const wrapper = document.createElement("div");
                    wrapper.style.display = "flex";
                    wrapper.style.gap = "4px";
                    wrapper.style.width = "100%";

                    const b = document.createElement("button");
                    b.className = "paletteItem componentBtn";
                    b.style.flex = "1";
                    b.innerHTML = `<strong>${escapeHtml(comp.name)}</strong><small>${comp.inputLabels.length} inputs · ${comp.outputLabels.length} outputs</small>`;
                    b.onclick = () => placeComponent(comp);

                    const deleteBtn = document.createElement("button");
                    deleteBtn.textContent = "×";
                    deleteBtn.title = "Delete component";
                    deleteBtn.style.padding = "6px 9px";
                    deleteBtn.style.background = "#b84a4a";

                    deleteBtn.onclick = (e) => {
                        e.stopPropagation();

                        state.components = state.components.filter(
                            (c) => c.id !== comp.id,
                        );

                        renderComponents();
                        render();
                    };

                    wrapper.appendChild(b);
                    wrapper.appendChild(deleteBtn);
                    bar.appendChild(wrapper);
                }
            }
            function escapeHtml(s) {
                return String(s).replace(
                    /[&<>"']/g,
                    (c) =>
                        ({
                            "&": "&amp;",
                            "<": "&lt;",
                            ">": "&gt;",
                            '"': "&quot;",
                            "'": "&#39;",
                        })[c],
                );
            }

            function serialise() {
                return JSON.stringify(
                    {
                        version: 4,
                        nodes: state.nodes,
                        wires: state.wires,
                        components: state.components,
                        pan: state.pan,
                        zoom: state.zoom,
                    },
                    null,
                    2,
                );
            }
            function applySerialised(obj) {
                state.nodes = Array.isArray(obj.nodes) ? obj.nodes : [];
                state.wires = Array.isArray(obj.wires) ? obj.wires : [];
                state.components = Array.isArray(obj.components)
                    ? obj.components
                    : [];
                state.nodes.forEach((n) => {
                    if (n.type === "INPUT" || n.type === "OUTPUT")
                        n.value = normaliseValue(n.value);
                });
                state.components.forEach((c) =>
                    (c.nodes || []).forEach((n) => {
                        if (n.type === "INPUT" || n.type === "OUTPUT")
                            n.value = normaliseValue(n.value);
                    }),
                );
                state.pan = obj.pan || { x: 0, y: 0 };
                state.zoom = obj.zoom || 1;
                state.selected.clear();
                state.selectedWire = null;
                // Backward compatibility for old components.
                state.components.forEach((c) => {
                    if (!c.inputLabels)
                        c.inputLabels = (c.nodes || [])
                            .filter((n) => n.type === "INPUT")
                            .map((n) => n.label);
                    if (!c.outputLabels)
                        c.outputLabels = (c.nodes || [])
                            .filter((n) => n.type === "OUTPUT")
                            .map((n) => n.label);
                });
                renderComponents();
                render();
            }
            function persist() {
                localStorage.setItem("logic-editor-state", serialise());
            }
            document.getElementById("saveLocal").onclick = () => {
                persist();
                alert("Saved to this browser.");
            };
            document.getElementById("loadLocal").onclick = () => {
                const raw = localStorage.getItem("logic-editor-state");
                if (!raw) {
                    alert("No saved circuit in this browser.");
                    return;
                }
                applySerialised(JSON.parse(raw));
            };
            document.getElementById("exportBtn").onclick = () => {
                const blob = new Blob([serialise()], {
                        type: "application/json",
                    }),
                    a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = "logic-circuit.json";
                a.click();
                URL.revokeObjectURL(a.href);
            };
            document.getElementById("importBtn").onclick = () =>
                document.getElementById("fileInput").click();
            document.getElementById("fileInput").onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    try {
                        applySerialised(JSON.parse(reader.result));
                    } catch (err) {
                        alert("Invalid circuit JSON.");
                    }
                };
                reader.readAsText(file);
            };

            window.addEventListener("keydown", (e) => {
                if (e.key === "Delete" || e.key === "Backspace") {
                    if (
                        document.activeElement === inlineLabel ||
                        valueDialog.open
                    )
                        return;
                    document.getElementById("deleteBtn").click();
                }
                if (e.key === "Escape") {
                    state.connecting = null;
                    state.rubberBand = null;
                    render();
                }
                if (e.key === " ") e.preventDefault();
            });
            window.addEventListener("keyup", (e) => {
                if (e.key === " " && state.isPanning) {
                    state.isPanning = false;
                    svg.classList.remove("panning");
                }
            });

            svg.addEventListener("dblclick", (e) => {
                const p = svgPoint(e);
                const n = state.nodes.find(
                    (n) =>
                        p.x >= n.x &&
                        p.x <= n.x + nodeWidth(n) &&
                        p.y >= n.y &&
                        p.y <= n.y + nodeHeight(n),
                );
                if (!n || (n.type !== "INPUT" && n.type !== "OUTPUT")) return;

                const splitX = n.x + ioLabelWidth(n);
                if (p.x <= splitX) beginRename(n);
            });

            renderComponents();
            render();
        </script>
    </body>
</html>
